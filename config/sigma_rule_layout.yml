  - {family: netsupport-rat, aliases: [NetSupport RAT, NetSupport]}
  - {family: openstrike, aliases: [OpenStrike]}
  - {family: orcus-rat, aliases: [Orcus RAT, Orcus]}
  - {family: raven-rat, aliases: [Raven RAT]}
  - {family: rhadamanthys, aliases: [Rhadamanthys]}
  - {family: shadow-rat, aliases: [Shadow RAT]}
  - {family: sliver, aliases: [Sliver C2, Sliver implant, Sliver beacon]}
