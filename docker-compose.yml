services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: cti_postgres
    command: ["postgres", "-c", "log_min_duration_statement=500"]
    shm_size: ${POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_DB: cti_scraper
      POSTGRES_USER: cti_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: America/New_York
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cti_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti_user -d cti_scraper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: cti_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cti_network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128M}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    container_name: cti_web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      # Security config (src/web/security/config.py) -- gated on APP_ENV=production.
      # Defaults below mirror .env.example's dev-safe values; set the real values in
      # .env to harden a deployment (see docs/guides/enterprise-sso.md).
      - APP_ENV=${APP_ENV:-development}
      - AUTH_MODE=${AUTH_MODE:-disabled}
      - ALLOW_INSECURE_PRODUCTION_AUTH_DISABLED=${ALLOW_INSECURE_PRODUCTION_AUTH_DISABLED:-false}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8001}
      - AUTH_TRUSTED_PROXY_HEADER=${AUTH_TRUSTED_PROXY_HEADER:-X-Huntable-Verified}
      - AUTH_TRUSTED_PROXY_VALUE=${AUTH_TRUSTED_PROXY_VALUE:-true}
      - AUTH_TRUSTED_PROXY_IPS=${AUTH_TRUSTED_PROXY_IPS:-}
      - ALLOW_INSECURE_PRODUCTION_TRUSTED_PROXY_OPEN=${ALLOW_INSECURE_PRODUCTION_TRUSTED_PROXY_OPEN:-false}
      - AUTH_USER_ID_HEADER=${AUTH_USER_ID_HEADER:-X-Huntable-User-Id}
      - AUTH_EMAIL_HEADER=${AUTH_EMAIL_HEADER:-X-Huntable-Email}
      - AUTH_NAME_HEADER=${AUTH_NAME_HEADER:-X-Huntable-Name}
      - AUTH_GROUPS_HEADER=${AUTH_GROUPS_HEADER:-X-Huntable-Groups}
      - AUTH_ADMIN_GROUPS=${AUTH_ADMIN_GROUPS:-}
      - AUTH_OPERATOR_GROUPS=${AUTH_OPERATOR_GROUPS:-}
      - AUTH_REVIEWER_GROUPS=${AUTH_REVIEWER_GROUPS:-}
      - AUTH_ANALYST_GROUPS=${AUTH_ANALYST_GROUPS:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - CSRF_ENABLED=${CSRF_ENABLED:-auto}
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=2048
      - CHATGPT_CONTENT_LIMIT=1000000
      - USE_LLM_RESPONSES=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_URL=https://api.anthropic.com/v1/messages
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_CONTENT_LIMIT=1000000
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - LMSTUDIO_API_URL=${LMSTUDIO_API_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=deepseek/deepseek-r1-0528-qwen3-8b
      - LMSTUDIO_MODEL_RANK=qwen/qwen3-4b-2507
      - LMSTUDIO_MODEL_EXTRACT=${LMSTUDIO_MODEL_EXTRACT:-qwen/qwen3-4b-2507}
      - LMSTUDIO_MODEL_SIGMA=${LMSTUDIO_MODEL_SIGMA:-qwen/qwen3-4b-2507}
      # Context length overrides (LM Studio API doesn't report actual configured context)
      - LMSTUDIO_CONTEXT_LENGTH_gemma_3n_e4b_it_text=16384
      - LMSTUDIO_CONTEXT_LENGTH_deepseek_deepseek_r1_0528_qwen3_8b=16384
      - LMSTUDIO_CONTEXT_LENGTH_qwen_qwen3_4b_2507=16384
      # - LANGGRAPH_SERVER_URL=${LANGGRAPH_SERVER_URL:-http://langgraph-server:2024}
      - WORKFLOW_LMSTUDIO_ENABLED=${WORKFLOW_LMSTUDIO_ENABLED:-true}
      - WORKFLOW_CODEX_ENABLED=${WORKFLOW_CODEX_ENABLED:-false}
      - WORKFLOW_CODEX_MODEL=${WORKFLOW_CODEX_MODEL:-gpt-5.6-luna}
      - CODEX_HOME=/var/lib/huntable-codex
      - OCR_INGEST_ENABLED=${OCR_INGEST_ENABLED:-true}
      - MAINTENANCE_API_URL=http://maintenance:8002
      - MAINTENANCE_API_TOKEN=${MAINTENANCE_API_TOKEN:-}
      - PROCEED_WITHOUT_LMSTUDIO=${PROCEED_WITHOUT_LMSTUDIO:-}
      - TZ=America/New_York
    ports:
      - "8001:8001"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./docs/contracts:/app/docs/contracts
      - ./data/diagnoses:/app/data/diagnoses
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./backups:/app/backups
      - ./models:/app/models
      - ./outputs:/app/outputs
      - codex_auth:/var/lib/huntable-codex
      - ./scripts:/app/scripts
      - ./test-results:/app/test-results
      - ${HOME}/Huntable-SIGMA-Rules:/app/sigma-repo
      - /var/db/timezone/zoneinfo/America/New_York:/etc/localtime:ro
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex_auth_init:
        condition: service_completed_successfully
      maintenance:
        condition: service_started
    networks:
      - cti_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-3G}
        reservations:
          memory: ${WEB_MEMORY_RESERVATION:-512M}
    command: >-
      uvicorn src.web.modern_main:app --host 0.0.0.0 --port 8001
      --workers 2

  maintenance:
    build:
      context: .
      dockerfile: Dockerfile
      target: maintenance-runtime
    environment:
      - MAINTENANCE_API_TOKEN=${MAINTENANCE_API_TOKEN:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/New_York
    volumes:
      - ./backups:/app/backups
      - ./config:/app/config
      - ./logs:/app/logs
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./scripts:/app/scripts
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cti_network
    restart: unless-stopped

  # Celery Worker for Background Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest-worker-runtime
    container_name: cti_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKFLOW_ANTHROPIC_API_KEY=${WORKFLOW_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY}}
      - WORKFLOW_OPENAI_API_KEY=${WORKFLOW_OPENAI_API_KEY:-${OPENAI_API_KEY}}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - LMSTUDIO_API_URL=${LMSTUDIO_API_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=deepseek/deepseek-r1-0528-qwen3-8b
      - LMSTUDIO_MODEL_RANK=qwen/qwen3-4b-2507
      - LMSTUDIO_MODEL_EXTRACT=${LMSTUDIO_MODEL_EXTRACT:-qwen/qwen3-4b-2507}
      - LMSTUDIO_MODEL_SIGMA=${LMSTUDIO_MODEL_SIGMA:-qwen/qwen3-4b-2507}
      # Context length overrides (LM Studio API doesn't report actual configured context)
      - LMSTUDIO_CONTEXT_LENGTH_gemma_3n_e4b_it_text=16384
      - LMSTUDIO_CONTEXT_LENGTH_deepseek_deepseek_r1_0528_qwen3_8b=4096
      - LMSTUDIO_CONTEXT_LENGTH_qwen_qwen3_4b_2507=16384
      - WORKFLOW_LMSTUDIO_ENABLED=${WORKFLOW_LMSTUDIO_ENABLED:-true}
      - WORKFLOW_CODEX_ENABLED=${WORKFLOW_CODEX_ENABLED:-false}
      - WORKFLOW_CODEX_MODEL=${WORKFLOW_CODEX_MODEL:-gpt-5.6-luna}
      - CODEX_HOME=/var/lib/huntable-codex
      - OCR_INGEST_ENABLED=${OCR_INGEST_ENABLED:-true}
      - PROCEED_WITHOUT_LMSTUDIO=${PROCEED_WITHOUT_LMSTUDIO:-}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./test-results:/app/test-results
      - codex_auth:/var/lib/huntable-codex
      - ${HOME}/Huntable-SIGMA-Rules:/app/sigma-repo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex_auth_init:
        condition: service_completed_successfully
    networks:
      - cti_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${WORKER_MEMORY_RESERVATION:-512M}
    # Unlike web (uvicorn --reload), Celery loads code at startup — restart worker after src/ changes.
    command: celery -A src.worker.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} -Q collection_immediate,default,source_checks,maintenance,reports,connectivity,collection --concurrency=${WORKER_CONCURRENCY:-2} --without-gossip --without-mingle --without-heartbeat
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Worker for Workflow Tasks (Dedicated Queue)
  workflow_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: workflow-worker-runtime
    container_name: cti_workflow_worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKFLOW_ANTHROPIC_API_KEY=${WORKFLOW_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY}}
      - WORKFLOW_OPENAI_API_KEY=${WORKFLOW_OPENAI_API_KEY:-${OPENAI_API_KEY}}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - LMSTUDIO_API_URL=${LMSTUDIO_API_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_MODEL=deepseek/deepseek-r1-0528-qwen3-8b
      - LMSTUDIO_MODEL_RANK=qwen/qwen3-4b-2507
      - LMSTUDIO_MODEL_EXTRACT=${LMSTUDIO_MODEL_EXTRACT:-qwen/qwen3-4b-2507}
      - LMSTUDIO_MODEL_SIGMA=${LMSTUDIO_MODEL_SIGMA:-qwen/qwen3-4b-2507}
      # Context length overrides (LM Studio API doesn't report actual configured context)
      - LMSTUDIO_CONTEXT_LENGTH_gemma_3n_e4b_it_text=16384
      - LMSTUDIO_CONTEXT_LENGTH_deepseek_deepseek_r1_0528_qwen3_8b=4096
      - LMSTUDIO_CONTEXT_LENGTH_qwen_qwen3_4b_2507=16384
      - WORKFLOW_LMSTUDIO_ENABLED=${WORKFLOW_LMSTUDIO_ENABLED:-true}
      - WORKFLOW_CODEX_ENABLED=${WORKFLOW_CODEX_ENABLED:-false}
      - WORKFLOW_CODEX_MODEL=${WORKFLOW_CODEX_MODEL:-gpt-5.6-luna}
      - CODEX_HOME=/var/lib/huntable-codex
      - PROCEED_WITHOUT_LMSTUDIO=${PROCEED_WITHOUT_LMSTUDIO:-}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./test-results:/app/test-results
      - codex_auth:/var/lib/huntable-codex
      - ${HOME}/Huntable-SIGMA-Rules:/app/sigma-repo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codex_auth_init:
        condition: service_completed_successfully
    networks:
      - cti_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${WORKFLOW_WORKER_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${WORKFLOW_WORKER_MEMORY_RESERVATION:-512M}
    # Restart after src/ changes (no autoreload).
    command: celery -A src.worker.celery_app worker --loglevel=${CELERY_LOG_LEVEL:-info} -Q workflows --concurrency=${WORKFLOW_WORKER_CONCURRENCY:-2} --without-gossip --without-mingle --without-heartbeat
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Initialize the shared Codex state volume for the non-root application user.
  codex_auth_init:
    image: busybox:1.36.1
    user: "0:0"
    volumes:
      - codex_auth:/var/lib/huntable-codex
    command: ["sh", "-c", "chown -R 1000:1000 /var/lib/huntable-codex"]
    restart: "no"

  # Celery Beat for Scheduled Tasks
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler-runtime
    container_name: cti_scheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./logs:/app/logs
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cti_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command: celery -A src.worker.celery_app beat --loglevel=${CELERY_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s



  # CLI Tool Service
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: semantic-tools-runtime
    container_name: cti_cli
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - SOURCES_CONFIG=/app/config/sources.yaml
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - OCR_INGEST_ENABLED=${OCR_INGEST_ENABLED:-true}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./tests:/app/tests
      - ./data:/app/data
      # Customer Sigma repo — same mount as web/worker so `run_cli.sh sigma
      # index-customer-repo` resolves SIGMA_REPO_PATH (/app/sigma-repo) instead of
      # silently no-op'ing on a missing path.
      - ${HOME}/Huntable-SIGMA-Rules:/app/sigma-repo
      - ./backups:/app/backups
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cti_network
    restart: unless-stopped
    profiles:
      - tools
    command: ["python", "-m", "src.cli.main"]

  # MCP over streamable-HTTP, for Docker MCP Gateway.
  #
  # The stdio launcher (scripts/run_mcp_server.sh) shells out to `docker compose
  # run` on the host, which the Gateway — itself a container — cannot do. It can
  # reach a remote streamable-HTTP MCP server, so this service serves the same
  # FastMCP instance over HTTP. Same tools, same write risk tiers.
  #
  # Bearer-protected and fails closed: without HUNTABLE_MCP_TOKEN the app raises
  # before binding, so the container exits instead of exposing execute_sql and
  # the write tools unauthenticated. Published on 127.0.0.1 only.
  #
  #   docker compose --profile mcp up -d mcp_http
  mcp_http:
    build:
      context: .
      dockerfile: Dockerfile
      target: semantic-tools-runtime
    container_name: cti_mcp_http
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cti_user:${POSTGRES_PASSWORD}@postgres:5432/cti_scraper
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - SOURCES_CONFIG=/app/config/sources.yaml
      - HUNTABLE_MCP_TOKEN=${HUNTABLE_MCP_TOKEN}
      # Bind all interfaces *inside* the container; the published port below is
      # what actually limits exposure to the loopback interface on the host.
      - HUNTABLE_MCP_HOST=0.0.0.0
      - HUNTABLE_MCP_PORT=8009
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
    ports:
      - "127.0.0.1:${HUNTABLE_MCP_PORT:-8009}:8009"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cti_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8009/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - mcp
    # Module entry point rather than run_mcp.py: only ./src is bind-mounted, so
    # the repo-root launcher would be whatever the image was built with.
    command: ["python", "-m", "src.huntable_mcp", "--transport", "http"]

  # LangFlow for Visual LangChain/LangGraph Workflow Management
  # langflow:
    # image: langflowai/langflow:latest
    # container_name: cti_langflow
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # environment:
    #   - LANGFLOW_PORT=${LANGFLOW_PORT:-7860}
    #   - LANGFLOW_HOST=${LANGFLOW_HOST:-0.0.0.0}
    #   - LANGFLOW_DATABASE_URL=sqlite:///data/langflow.db
    #   - LANGGRAPH_SERVER_URL=http://langgraph-server:2024
    #   - OPENAI_API_KEY=${OPENAI_API_KEY}
    #   - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    #   - CHATGPT_API_KEY=${CHATGPT_API_KEY}
    #   - LMSTUDIO_API_URL=${LMSTUDIO_API_URL:-http://host.docker.internal:1234/v1}
    #   - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-deepseek/deepseek-r1-0528-qwen3-8b}
    #   - LMSTUDIO_API_KEY=dummy
    #   - TZ=America/New_York
    # ports:
    #   - "${LANGFLOW_PORT:-7860}:7860"
    # volumes:
    #   - langflow_data:/data
    #   - ./langgraph.json:/app/langgraph.json:ro
    #   - ./langflow_components:/app/langflow_components:ro
    #   - ./src:/app/src:ro
    #   - ./config:/app/config:ro
    # depends_on:
    #   langgraph-server:
    #     condition: service_started
    # networks:
    #   - cti_network
    # restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost:7860/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  langflow_data:
    driver: local
  hf_cache:
    driver: local
  codex_auth:
    driver: local

networks:
  cti_network:
    driver: bridge
