<div id="skeleton-loading" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        {% for _ in range(4) %}
        <div class="card p-6 animate-pulse">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-lg bg-gray-300 dark:bg-gray-600"></div>
                <div class="ml-4 flex-1">
                    <div class="h-3 w-20 bg-gray-300 dark:bg-gray-600 rounded mb-2"></div>
                    <div class="h-5 w-12 bg-gray-300 dark:bg-gray-600 rounded"></div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-6">
        {% for _ in range(2) %}
        <div class="card p-6 animate-pulse">
            <div class="h-5 w-48 bg-gray-300 dark:bg-gray-600 rounded mb-4"></div>
            <div class="h-64 bg-gray-200 dark:bg-gray-700 rounded"></div>
        </div>
        {% endfor %}
    </div>
</div>
