<script>
    // Essential functions that must be available immediately for onclick handlers
    // Defined in separate script block to ensure they load even if main script has errors
    
    function setAnnotationMode(mode) {
        try {
            if (window.simpleTextManager) {
                window.simpleTextManager.setAnnotationMode(mode);
            } else {
                console.warn('setAnnotationMode called before simpleTextManager initialized, mode:', mode);
                localStorage.setItem('annotationMode', mode);
            }
        } catch (error) {
            console.error('Error in setAnnotationMode:', error);
        }
    }
    window.setAnnotationMode = setAnnotationMode;
    
    function copyArticleContentToClipboard() {
        try {
            const contentElement = document.getElementById('article-content');
            if (!contentElement) {
                showNotification('Article content element not found', 'error');
                return;
            }
            
            const textContent = contentElement.innerText || contentElement.textContent || '';
            
            if (!textContent.trim()) {
                showNotification('Article has no content to copy', 'error');
                return;
            }
            
            navigator.clipboard.writeText(textContent).then(() => {
                showNotification('Article content copied to clipboard!', 'success');
            }).catch(error => {
                console.error('Error copying to clipboard:', error);
                showNotification('Failed to copy article content', 'error');
            });
        } catch (error) {
            console.error('Error copying article content:', error);
            showNotification('Failed to copy article content', 'error');
        }
    }
    window.copyArticleContentToClipboard = copyArticleContentToClipboard;

    function ensureModalConfirmAvailable() {
        if (!window.ModalManager || typeof window.ModalManager.confirm === 'function') return;

        window.ModalManager.confirm = function confirmModal(message, options) {
            options = options || {};
            return new Promise(function(resolve) {
                const id = '_article_confirm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                const modal = document.createElement('div');
                modal.id = id;
                modal.className = 'hidden fixed inset-0 flex items-center justify-center z-50';
                modal.style.background = 'rgba(0,0,0,0.6)';
                modal.style.backdropFilter = 'blur(4px)';

                const title = options.title || 'Confirm';
                const confirmText = options.confirmText || 'OK';
                const cancelText = options.cancelText || 'Cancel';
                const confirmClass = options.confirmClass || 'bg-purple-600 hover:bg-purple-700';
                const escapeHtml = function(text) {
                    const div = document.createElement('div');
                    div.textContent = text == null ? '' : String(text);
                    return div.innerHTML;
                };

                modal.innerHTML =
                    '<div class="w-full max-w-sm mx-4 rounded-xl overflow-hidden" style="background: var(--panel-bg-2); border: 1px solid var(--border-subtle); box-shadow: 0 24px 80px rgba(0,0,0,0.5);">' +
                        '<div class="px-5 pt-5 pb-4">' +
                            '<h3 class="text-sm font-bold mb-2" style="font-family: Inter, system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-primary);">' + escapeHtml(title) + '</h3>' +
                            '<p class="text-xs" style="color: var(--text-secondary);">' + escapeHtml(message) + '</p>' +
                        '</div>' +
                        '<div class="flex justify-end gap-2 px-5 py-3" style="border-top: 1px solid var(--border-muted);">' +
                            '<button class="cancel-btn px-3 py-1.5 text-xs border border-gray-600 hover:bg-gray-800 text-gray-300 rounded-lg">' + escapeHtml(cancelText) + '</button>' +
                            '<button class="confirm-btn px-3 py-1.5 text-xs text-white rounded-md transition-colors font-semibold ' + confirmClass + '">' + escapeHtml(confirmText) + '</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(modal);

                function cleanup(result) {
                    const el = document.getElementById(id);
                    if (el) {
                        window.ModalManager.close(id);
                        el.remove();
                    }
                    resolve(result);
                }

                modal.querySelector('.cancel-btn').addEventListener('click', function() { cleanup(false); });
                modal.querySelector('.confirm-btn').addEventListener('click', function() { cleanup(true); });
                window.ModalManager.register(id, { submitButton: '.confirm-btn', isDynamic: true, hasInput: false });
                window.ModalManager.open(id);
            });
        };
    }
    window.ensureModalConfirmAvailable = ensureModalConfirmAvailable;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureModalConfirmAvailable);
    } else {
        ensureModalConfirmAvailable();
    }
</script>
