    <script>
        /** Normalize FastAPI error payloads: detail may be a string or validation error list. */
        function formatApiErrorDetail(detail) {
            if (detail == null || detail === '') return '';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) {
                return detail
                    .map((item) => {
                        if (item && typeof item === 'object' && item.msg) return item.msg;
                        try {
                            return JSON.stringify(item);
                        } catch (e) {
                            return String(item);
                        }
                    })
                    .filter(Boolean)
                    .join('; ');
            }
            return String(detail);
        }

        // Define triggerWorkflowForArticle early to ensure it's available for inline handlers
        // Tracks whether the article has already been processed with the current active config.
        // Loaded async on page load; drives button label and force flag.
        let _articleProcessedWithCurrentConfig = false;
        let _latestExecutionId = null;
        let _configIsRunnable = true; // false when no agent models are configured

        async function initWorkflowButtonState(articleId) {
            try {
                const [statusResult, configResult] = await Promise.allSettled([
                    fetch(`/api/articles/${articleId}/workflow-status`),
                    fetch('/api/workflow/config'),
                ]);

                if (statusResult.status === 'fulfilled' && statusResult.value.ok) {
                    const data = await statusResult.value.json();
                    _articleProcessedWithCurrentConfig = !!data.processed_with_current_config;
                    _latestExecutionId = data.latest_execution_id || null;

                    // Fallback: if the server predates the latest_execution_id field, resolve it
                    // from the executions API so the "View last run" link always works.
                    if (_articleProcessedWithCurrentConfig && !_latestExecutionId) {
                        try {
                            const execResp = await fetch(`/api/workflow/executions?article_id=${articleId}&status=completed&limit=1`);
                            if (execResp.ok) {
                                const execData = await execResp.json();
                                const execs = execData.executions || [];
                                if (execs.length > 0) _latestExecutionId = execs[0].id;
                            }
                        } catch (_) { /* non-fatal */ }
                    }
                }

                if (configResult.status === 'fulfilled' && configResult.value.ok) {
                    const cfg = await configResult.value.json();
                    const models = cfg.agent_models || {};
                    // ExtractAgent is the core pipeline agent; no model = workflow cannot run
                    _configIsRunnable = !!models.ExtractAgent;
                }
            } catch (e) {
                // Leave defaults on network error
            }
            updateWorkflowButtonLabel();
        }

        function updateWorkflowButtonLabel() {
            const btnText = document.getElementById('triggerWorkflowBtnText');
            const btn = document.getElementById('triggerWorkflowBtn');
            const viewLastRunLink = document.getElementById('viewLastRunLink');
            if (!btnText || !btn) return;

            if (!_configIsRunnable) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btnText.textContent = 'Send to Workflow';
                btn.title = 'No agents configured  --  set up models in Settings → Workflow Config first.';
                if (viewLastRunLink) viewLastRunLink.classList.add('hidden');
                return;
            }

            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            if (_articleProcessedWithCurrentConfig) {
                btnText.textContent = 'Reprocess';
                btn.title = 'Reprocess: bypasses idempotency gate and runs the pipeline even if this article was already processed with the current config. Use after changing prompts or model settings to get fresh output.';
                if (viewLastRunLink && _latestExecutionId) {
                    viewLastRunLink.href = `/workflow?open_execution=${_latestExecutionId}#executions`;
                    viewLastRunLink.classList.remove('hidden');
                }
            } else {
                btnText.textContent = 'Send to Workflow';
                btn.title = 'Send to Workflow: runs this article through the current agent config for the first time.';
                if (viewLastRunLink) viewLastRunLink.classList.add('hidden');
            }
        }

        async function triggerWorkflowForArticle(articleId) {
            const btn = document.getElementById('triggerWorkflowBtn');
            const btnText = document.getElementById('triggerWorkflowBtnText');
            const useForce = _articleProcessedWithCurrentConfig;

            // Disable button and show loading state
            if (btn) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
            if (btnText) {
                btnText.textContent = 'Triggering...';
            }

            try {
                // showNotification might not be defined yet, use console as fallback
                if (typeof showNotification === 'function') {
                    showNotification('Triggering workflow...', 'info');
                }

                // Manual triggers always pass force=true to skip the auto-trigger
                // threshold (which is only for unattended/automated runs).
                // The button label (Send to Workflow vs Reprocess) is informational only.
                const url = `/api/workflow/articles/${articleId}/trigger?force=true`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const message = `Workflow triggered successfully! Execution ID: ${data.execution_id || 'N/A'}`;
                    showNotification(message, 'success');

                    // Redirect to workflow executions page
                    window.location.href = '/workflow#executions';
                } else {
                    let errorData;
                    try {
                        errorData = await response.json();
                    } catch (e) {
                        errorData = { detail: `HTTP ${response.status}: ${response.statusText}` };
                    }

                    const errorMessage =
                        formatApiErrorDetail(errorData.detail) ||
                        errorData.message ||
                        'Failed to trigger workflow';
                    showNotification(`Error: ${errorMessage}`, 'error');

                    // If there's an existing execution, offer to view it
                    if (errorMessage.includes('already has an active workflow execution')) {
                        const execIdMatch = errorMessage.match(/execution \(ID: (\d+)\)/);
                        if (execIdMatch) {
                            const execId = execIdMatch[1];
                            setTimeout(async () => {
                                const confirmed = await ModalManager.confirm(
                                    'An execution already exists for this article. Would you like to view the existing execution?',
                                    { title: 'Existing Execution', confirmText: 'View', confirmClass: 'bg-blue-600 hover:bg-blue-700', cancelText: 'Cancel' }
                                );
                                if (confirmed) {
                                    window.location.href = `/workflow#executions`;
                                }
                            }, 100);
                        }
                    }
                }
            } catch (error) {
                console.error('Error triggering workflow:', error);
                const errorMsg = `Error: ${error.message}`;
                showNotification(errorMsg, 'error');
            } finally {
                // Re-enable button and restore correct label
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
                updateWorkflowButtonLabel();
            }
        }

        // Explicitly attach to window for inline onclick handlers
        window.triggerWorkflowForArticle = triggerWorkflowForArticle;

        // Load button state as soon as article ID is available
        initWorkflowButtonState({{ article.id|default(0)|int }});
    </script>
