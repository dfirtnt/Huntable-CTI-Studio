name: Lint

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Ruff check
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3
        with:
          args: format --check

  check-pinned-versions:
    name: Enforce Pinned Versions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Check for unpinned Python versions
        run: |
          python3 - <<'PYEOF'
          import sys, pathlib
          # Only requirements.txt is authoritative for pinned deps.
          # pyproject.toml legitimately uses >= for security-floor transitive pins
          # and TOML key=value syntax would produce false positives in a grep scan.
          unpinned = []
          for line in pathlib.Path("requirements.txt").read_text().splitlines():
            stripped = line.strip()
            if not stripped or stripped.startswith("#"):
              continue
            if ">=" in stripped and "#" not in stripped:
              unpinned.append(stripped)
          if unpinned:
            print("ERROR: Found unpinned versions in requirements.txt (must use == not >=):")
            for u in unpinned:
              print(" ", u)
            sys.exit(1)
          print("All Python dependencies in requirements.txt pinned with ==")
          PYEOF

      - name: Check for unpinned Node versions
        run: |
          set +e
          UNPINNED=$(grep -n '["\^~]' package.json | grep -E '"\^|"~' || true)
          set -e
          if [ -n "$UNPINNED" ]; then
            echo "ERROR: Found caret/tilde ranges in package.json (must use exact versions):"
            echo "$UNPINNED"
            exit 1
          fi
          echo "✓ All Node dependencies pinned with exact versions"

      - name: Check for unpinned GitHub Actions
        run: |
          python3 - <<'PYEOF'
          import re, sys, pathlib
          # GitHub Actions must be pinned to a full 40-char commit SHA, not a
          # mutable tag/branch (tags can be silently repointed by the action
          # owner -- see the tj-actions/changed-files and reviewdog-style
          # supply-chain compromises). Keep a `# vX` comment alongside the SHA
          # so Dependabot's github-actions ecosystem can still open version-bump
          # PRs against the pinned commit.
          # Anchor on the stripped line starting with "uses:" (a real YAML key),
          # not a substring match -- this file's own embedded script mentions
          # "uses:" in comments/regex text, which a substring check would flag.
          sha_pattern = re.compile(r"^uses:\s*[\w.-]+/[\w./-]+@([0-9a-f]+)\s*(#.*)?$")
          unpinned = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
            for lineno, line in enumerate(path.read_text().splitlines(), start=1):
              stripped = line.strip()
              if stripped.startswith("- "):
                stripped = stripped[2:]
              if not stripped.startswith("uses:"):
                continue
              match = sha_pattern.match(stripped)
              if not match or len(match.group(1)) != 40:
                unpinned.append(f"{path}:{lineno}: {line.strip()}")
          if unpinned:
            print("ERROR: Found GitHub Actions not pinned to a full 40-char commit SHA:")
            for u in unpinned:
              print(" ", u)
            sys.exit(1)
          print("All GitHub Actions pinned to a commit SHA")
          PYEOF

  ui-contract:
    name: UX Contract (button styling)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Check for new UX contract violations
        run: python3 scripts/check_ui_contract.py

  vulture:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev --no-group test

      - name: Run vulture
        run: uv run vulture src scripts vulture_whitelist.py --min-confidence 80

  lockfile:
    name: Lockfile Up To Date
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true

      # Every other job installs with --frozen, which trusts uv.lock as-is and
      # never checks it against pyproject.toml. A stale lock therefore passes
      # CI silently. --check fails if re-locking would change the file.
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  paired-surfaces:
    name: Paired Surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Needs a PR base to diff against; pushes have no meaningful pair boundary.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0

      # models.py must move with a scripts/migrate_*.py (migrations are never
      # auto-applied); src/prompts and workflow_config_schema.py must move with
      # config/presets (the runtime reads presets, not the prompt files).
      # Escape labels: no-migration-needed, no-preset-sync-needed.
      - name: Check paired surfaces moved together
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/check_paired_surfaces.py --base "origin/$BASE_REF" --head HEAD --labels "$PR_LABELS"
