name: Dependency Review

on:
  pull_request:

concurrency:
  group: deprev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later
          license-check: false
          # GHSA-w8v5-vhqr-4h9v: diskcache 5.6.3 unsafe pickle deserialization;
          # mirrors the pip-audit CVE-2025-69872 ignore. diskcache is used only
          # for local response caching and never deserializes untrusted input.
          # GHSA-8mgp-746c-j5xp (PYSEC-2026-3740): nltk path traversal in model-artifact
          # APIs; mirrors the pip-audit ignore. nltk 3.10.3 is the latest PyPI release
          # and still flagged -- no fix exists yet. nltk is a transitive test-only
          # dependency of `safety`, never used by app code.
          allow-ghsas: GHSA-w8v5-vhqr-4h9v, GHSA-8mgp-746c-j5xp
